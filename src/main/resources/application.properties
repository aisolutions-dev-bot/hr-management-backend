# MYSQL Settings
quarkus.datasource.db-kind=mysql
quarkus.datasource.reactive.url=${DB_URL}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.reactive.max-size=7
quarkus.datasource.reactive.idle-removal-interval=PT2M

# Connection timeout settings
quarkus.datasource.reactive.connect-timeout=30
quarkus.datasource.reactive.idle-timeout=PT30S
quarkus.datasource.reactive.max-lifetime=PT5M
quarkus.thread-pool.max-threads=8

quarkus.http.port=8092

organization-api/mp-rest/url=http://localhost:8080
%prod.organization-api/mp-rest/url=${ORG_SERVICE_URL:http://ai-solutions-organization-api.railway.internal:8080}
%staging.organization-api/mp-rest/url=${ORG_SERVICE_URL}

# CORS Settings frontend (4011 = HR Administration, 4012 = HR Management)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4000,http://localhost:4200,http://localhost:4011,http://localhost:4012
%prod.quarkus.http.cors.origins=https://ai-solutions-shell-production.up.railway.app,https://aisolutionspl.up.railway.app,https://aisolutionspl.com
%staging.quarkus.http.cors.origins=https://ai-solutions-shell-production.up.railway.app,https://aisolutionspl.up.railway.app,https://aisolutionspl.com
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=X-Custom,Content-Type,Authorization,authorization,X-Login-Type
quarkus.http.cors.exposed-headers=Content-Disposition,Content-Length,authorization
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# HTTP body / multipart limits - receipt photo uploads (single + bulk OCR)
# Quarkus defaults (max-body-size=10MB, max-form-attribute-size=2KB) are too small for photos.
quarkus.http.limits.max-body-size=50M
quarkus.http.limits.max-form-attribute-size=10M
quarkus.http.body.handle-file-uploads=true
quarkus.http.body.uploads-directory=${java.io.tmpdir}

# Kafka staff-events (consumer present but disabled; devservices off to avoid a dev container)
mp.messaging.incoming.staff-events.connector=smallrye-kafka
mp.messaging.incoming.staff-events.topic=staff.events
mp.messaging.incoming.staff-events.auto.offset.reset=latest
mp.messaging.incoming.staff-events.bootstrap.servers=localhost:9092
mp.messaging.incoming.staff-events.group.id=staff-events-group
mp.messaging.incoming.staff-events.enabled=false
quarkus.kafka.devservices.enabled=false

# FTP Settings (receipt attachment storage)
ftp.host=${FTP_HOST:ftp.example.com}
ftp.port=${FTP_PORT:21}
ftp.username=${FTP_USERNAME:ftpuser}
ftp.password=${FTP_PASSWORD:ftppass}
ftp.base-path=${FTP_BASE_PATH:/claim-attachments}

# OpenAI API (receipt OCR via Vision)
openai.api.key=${OPENAI_API_KEY}
quarkus.rest-client.openai-api.url=https://api.openai.com
quarkus.rest-client.openai-api.scope=jakarta.inject.Singleton
quarkus.rest-client.openai-api.connect-timeout=30000
quarkus.rest-client.openai-api.read-timeout=120000
